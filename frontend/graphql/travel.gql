fragment TravelFields on TravelEntity {
  id
  attributes {
    meeting
    meeting_latitude
    meeting_longitude
    departureDate
    departureTime
    details
    vehicleName
    firstname
    lastname
    phone_number
    seats
    email
    passengers {
      data {
        id
        attributes {
          name
          lastname
          location
          phone
          email
          user {
            data {
              id
              attributes {
                firstName
                lastName
                email
              }
            }
          }
        }
      }
    }
  }
}

mutation createTravel($travel: TravelInput!) {
  createTravel(data: $travel) {
    data {
      ...TravelFields
    }
  }
}

mutation updateTravel($id: ID!, $travelUpdate: TravelInput!) {
  updateTravel(id: $id, data: $travelUpdate) {
    data {
      ...TravelFields
    }
  }
}

mutation deleteTravel($id: ID!) {
  deleteTravel(id: $id) {
    data {
      id
    }
  }
}
